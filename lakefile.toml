name = "dev-widgets"
version = "0.0.1"
defaultTargets = ["DevWidgets"]
testDriver = "Tests"

[[lean_lib]]
name = "DevWidgets"
roots = ["DevWidgets.CE", "DevWidgets.PTracker", "DevWidgets.InfoTreeExplorer", "DevWidgets.DocString", "DevWidgets.Lib"]

[[lean_lib]]
name = "Examples"
roots = [
  "examples.CE",
  "examples.PTracker",
  "examples.InfoViewExplorer",
  "examples.InfoTreeFocused",
  "examples.DocString",
  "examples.Configuration"
]

[[lean_lib]]
name = "Tests"
needs = ["widgetRuntime", "widgetServer"]
roots = [
  "tests.CE.RpcAndSchema",
  "tests.CE.Compilation",
  "tests.PTracker.RpcContracts",
  "tests.InfoTreeExplorer.AtPos",
  "tests.InfoTreeExplorer.RpcContracts",
  "tests.Lib.Resource",
  "tests.Rpc.QualifiedMethodNames",
  "tests.DocString.Resolver",
  "tests.DocString.VersoLean",
  "tests.Widget.Runtime",
  "tests.Widget.Activation",
  "tests.Widget.DefaultActivation",
  "tests.Widget.Server",
  "tests.Widget.Interactive",
  "tests.Examples.Smoke"
]

[[input_file]]
name = "widgetRuntime"
path = "tests/Widget/runtime.mjs"
text = true

[[input_file]]
name = "widgetServer"
path = "tests/Widget/server.mjs"
text = true
